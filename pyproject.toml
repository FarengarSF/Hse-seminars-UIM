[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "world-news-bot"
version = "0.1.0"
description = "Telegram-агрегатор главных мировых новостей"
requires-python = ">=3.10"
dependencies = []

[project.scripts]
world-news-bot = "newsbot.__main__:main"

[tool.setuptools.packages.find]
include = ["newsbot*"]

